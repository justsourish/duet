name: Release

# Push a tag like v0.1.0 to build installers for Mac and Windows.
# The release is created as a draft, so nothing is public until you publish it.

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target aarch64-apple-darwin
            rust-targets: aarch64-apple-darwin
          - platform: macos-latest
            args: --target x86_64-apple-darwin
            rust-targets: x86_64-apple-darwin
          - platform: windows-latest
            args: ""
            rust-targets: ""
    runs-on: ${{ matrix.platform }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: ./src-tauri -> target
      - run: npm ci
      - uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # "-" signs the Mac app ad hoc, which Apple Silicon needs in order to run it at all.
          # It is not a paid certificate, so people still see the first-launch warning.
          APPLE_SIGNING_IDENTITY: "-"
        with:
          tagName: ${{ github.ref_name }}
          releaseName: Duet ${{ github.ref_name }}
          releaseBody: |
            Early release. Read the install guide first: https://github.com/justsourish/duet/blob/main/docs/install.md

            This app is not signed with a paid certificate, so Mac and Windows will ask you to confirm the first time you open it. The guide shows exactly how.

            The AI chat works with Claude Code today. Windows builds are new and less tested than Mac.
          releaseDraft: true
          prerelease: true
          args: ${{ matrix.args }}
